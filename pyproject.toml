[project]
name = "aadistill"
version = "0.0.1"
description = "AlphaAvatar-distill: agent-driven compression and distillation of LLMs into realtime student models"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers>=4.53",
    "safetensors>=0.4",
    "datasets>=5.0.0",
    # Required by the capability battery's math scorer. Declared explicitly
    # because an optional import made scoring machine-dependent.
    "sympy>=1.13",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aadistill"]

# CPU-only torch wheels for the current CPU-only dev box (AGENTS.md P8.1).
# On a GPU machine, switch this index to the matching CUDA channel and re-lock;
# experiment definitions themselves do not change.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# Keep failure evidence, drop the rest.
#
# On 2026-09-11 the root filesystem filled at 100% and a pod-like sweep died
# mid-run, leaving 869 gitignored artifacts displaced and two tracked files
# truncated to zero bytes. 13 GiB of that disk was `/tmp/pytest-of-*`: pytest
# keeps the last three `tmp_path` roots by default, and a full suite of this
# repository leaves about 3.5 GiB in each, so a handful of runs is a problem
# nobody sees until something else needs the space.
#
# `failed` keeps the tmp_path of any test that failed -- which is the evidence
# worth having -- and discards the rest as each run ends. `count = 1` bounds
# what survives across runs. This is pytest's own mechanism, not a cleanup
# framework: nothing here deletes by pattern, so no other user's or other
# project's directory is reachable from it.
[tool.pytest.ini_options]
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
