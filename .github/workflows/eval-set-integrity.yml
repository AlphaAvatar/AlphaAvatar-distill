# Refuses any change that makes a registered evaluation set differ from its
# authorized identity, or that changes a scorer's verdict on the registered
# conformance vectors (AGENTS.md P10.3). CPU only; no model, no download.
name: eval-set-integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scorer dependencies
        # the legacy scorer imports torch transitively (aadistill.data.dataset);
        # the CPU wheel is enough, nothing here runs a model
        run: |
          python -m pip install "torch==2.9.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy==2.2.6" "sympy==1.14.0" "pytest==8.4.2"
      - name: Bytes match the authorized identity
        run: PYTHONPATH=src:scripts python -m shared.eval_sets
      - name: Scoring semantics reproduce the conformance vectors
        run: PYTHONPATH=src:scripts python scripts/shared/evaluation/eval_set_scoring.py conformance
      - name: Registry guard tests
        run: python -m pytest -q -p no:cacheprovider tests/data/test_eval_set_registry.py tests/evaluation/test_eval_registry.py
